# ============================================================================
# HARVEST — every spec saved, with provenance
# ============================================================================
harvest:
  source_pattern: >-
    Lone Wolf's documentation hub runs on Bump.sh. Each rendered document exposes its raw
    definition at <doc-url>.json and <doc-url>.yaml — linked from the page itself, not
    guessed. All seven were fetched anonymously with no credentials, no signup and no
    referer, and every one was confirmed to parse with yaml.safe_load before being kept.
  fetch_date: '2026-07-26'
  specs_saved: 7
  total_operations: 348
  specs:
    - file: openapi/lone-wolf-transact-api-openapi.yml
      source_url: https://apidocs.lwolf.com/doc/transact-api.yaml
      http_status: 200
      openapi_version: 3.0.3
      title: Transact API
      info_version: 1.0.0
      servers:
        - https://gateway.lwolf.com
        - '{tw_host}'
      paths: 37
      operations: 53
      parses: true
