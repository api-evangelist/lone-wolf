quality_notes:
  strengths:
    - Seven complete OpenAPI 3.0 definitions, downloadable anonymously, all parsing.
    - A real, branded, publicly reachable developer portal with a clear three-step onboarding path.
    - Live OIDC discovery document and a documented OAuth 2.0 authorization-code flow on TransactionDesk.
    - Per-API changelogs and a cross-API changelog.
    - A live MCP server endpoint and a Markdown export, making the estate agent-consumable.
    - Published sandbox/preproduction hosts for WolfConnect, zipForm and TransactionDesk.
  gaps:
    - The Authentisign and Back Office definitions declare no securitySchemes at all.
    - The Deals API — the largest surface — declares no servers block.
    - TransactionDesk publishes only a preproduction host.
    - The official API Portal's "Back Office — Review API docs" link is broken (404).
    - No SDKs, no client libraries, no CLI, no Postman collection, no GitHub organization.
    - No AsyncAPI and no proper webhook catalog; callbacks are limited to signing events.
    - No product/resource scopes exposed at the OIDC discovery endpoint.
    - >-
      The Transact API description still contains an unreplaced vendor placeholder — a
      literal "<!-- TODO: replace with the real raw spec URL -->" and a
      "https://bump.sh/<org>/doc/transact/download" template — shipped in production docs.
    - >-
      Six brands, six documentation systems (Bump.sh, Slate, Propertybase, Cloud CMA
      custom) and five distinct auth schemes: the acquisition roll-up is not yet unified
      behind the Foundation platform it markets.
