summary: >-
  Only the Lone Wolf identity gateway (gateway.lwolf.com, an Auth0-backed tenant) publishes a
  /.well-known/ discovery surface. It serves both OIDC discovery and RFC 8414 OAuth
  authorization-server metadata (identical documents) plus a JWKS. No other Lone Wolf API host
  — api.lwolf.com, deals.api.lwolf.com, authentication.api.lwolf.com, ws.zipformplus.com,
  api.globalwolfweb.com, api.pre.transactiondesk.com — nor the docs host or the marketing site
  publishes any /.well-known/ document. No RFC 9116 security.txt anywhere. No RFC 9727
  /.well-known/api-catalog. deals.api and authentication.api return 405 (method/route not
  served) rather than 404.
