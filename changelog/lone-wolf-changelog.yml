summary: >-
  Lone Wolf's documentation hub publishes a dated change feed covering every published API, and
  the same feed is queryable programmatically through the hub's MCP server (list_changes /
  get_change). Entries are auto-generated diffs of the OpenAPI definitions, typed as either
  "API documentation has been created" (first publication) or "API structure has changed"
  (a spec diff, with Added / Removed / Modified sections and explicit [Breaking] annotations
  on removals). The whole feed is 18 entries deep and begins 2025-08-25 — Lone Wolf's public
  API documentation program is under a year old.
