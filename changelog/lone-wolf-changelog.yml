observations:
  - >-
    Publication order tracks the platform story: Back Office (Aug 2025) and Authentisign
    (Sep 2025) first, Transact (Nov 2025), then a burst in mid-2026 — TransactionDesk (Jun),
    zipForm (Jun), Deals (Jun) and WolfConnect (Jul) — around the 2026-02-02 API Portal launch.
  - >-
    The change feed marks breaking changes but there is no advance-notice policy behind it; see
    lifecycle/lone-wolf-lifecycle.yml.
