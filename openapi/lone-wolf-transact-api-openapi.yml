          resources are scoped to a user.
        schema:
          type: string
          format: uuid
      - name: "$expand"
        in: query
        required: false
        description: Comma-separated list of related entities to include inline in
          the response.
        schema:
          type: string
        example: members, opportunities
      - name: "$filter"
