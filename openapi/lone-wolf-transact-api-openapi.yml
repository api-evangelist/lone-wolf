                Files:
                  type: string
                  format: binary
                  description: Document file(s) to include in the signing.
                CallbackUrl:
                  type: string
                  format: uri
                  description: Optional callback URL invoked on signing events.
                TransactionId:
                  type: string
                  format: uuid
                  description: Optional GUID of the transaction to associate the signing
                    with.
