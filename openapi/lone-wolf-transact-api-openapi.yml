  "/transact-workflow/v1/Documents":
    post:
      tags:
      - Documents
      summary: Upload a document
      description: Uploads a document file to a transaction. The request is sent as
        `multipart/form-data`. A user-scoped alternative is available at `POST /transact-workflow/v1/users/{userId}/documents`.
      operationId: createDocument
      responses:
        '201':
          description: Document uploaded.
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - name
              - file
              - transactionId
              - userId
              properties:
                name:
                  type: string
                  description: Display name of the document.
                file:
                  type: string
                  format: binary
                  description: The document file to upload.
                transactionId:
                  type: string
                  format: uuid
                  description: GUID of the transaction the document belongs to.
                parentId:
                  type: string
                  format: uuid
                  description: Optional GUID of the folder to place the document in.
                formId:
                  type: string
                  format: uuid
                  description: Optional GUID of a form to associate the document with.
                userId:
                  type: string
                  format: uuid
                  description: GUID of the user uploading the document.
