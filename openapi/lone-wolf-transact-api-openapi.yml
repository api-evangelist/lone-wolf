                name:
                  type: string
                  description: Display name of the document.
                file:
                  type: string
                  format: binary
                  description: The document file to upload.
                transactionId:
                  type: string
                  format: uuid
                  description: GUID of the transaction the document belongs to.
                parentId:
                  type: string
                  format: uuid
