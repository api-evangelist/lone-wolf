          description: The version of the record in the database.
    Transaction:
      type: object
      required:
      - PropertyTypeId
      - ClassificationId
      - CloseDate
      - OfferDate
      - SellPrice
      - MLSAddress
      - Tiers
      properties:
        Id:
          type: string
          maxLength: 50
          description: The Lone Wolf Id of the transaction. Required for updates only.
            It will be ignored when creating a new transaction.
        Number:
          type: string
          maxLength: 15
          description: The transaction number. In most cases, the transaction number
            will be automatically generated. This is only required if the primary
            office for the trade allows manual transaction number entry and it has
            not setup a sequence for transaction numbers.
        MLSNumber:
          type: string
          maxLength: 15
          description: The MLS number for the listing associated to the transaction.
        PropertyTypeId:
          type: string
          maxLength: 50
          description: The Lone Wolf Id of the property type. This is an Id that is
            retrieved from the property types resource.
        PropertyType:
          readOnly: true
          allOf:
          - "$ref": "#/components/schemas/PropertyType"
          description: The property type. See the Property Types API section for the
            object definition.
        ClassificationId:
          type: string
          maxLength: 50
          description: The Lone Wolf Id of the classification. This is an Id that
            is retrieved from the classifications resource.
        Classification:
          readOnly: true
          allOf:
          - "$ref": "#/components/schemas/Classification"
          description: The classification. See the Classifications API section for
            the object definition.
        StatusCode:
          type: string
          readOnly: true
          description: 'The code for the status. N: Open, A: Closed, P: Partially
            closed (not all but at least one tier has been finalized), B: Fallen through
            because of a condition, C: Fallen through'
        Status:
          type: string
          readOnly: true
          description: The name of the status. This field is read only.
        EntryDate:
          type: string
          format: date
          description: The date the transaction was entered. This is not the date
            that the transaction record was created (though in most cases, it will
            be the same value). This is a client specified date. If not specified,
            then the current date is used.
        CloseDate:
          type: string
          format: date
          description: The date the transaction closed.
        OfferDate:
          type: string
          format: date
          description: The date an offer was made on the transaction.
        SellPrice:
          type: number
          description: The final sale price.
        LegalDescription:
          type: string
          maxLength: 100
          description: Any legal notices for the transaction.
        MLSAddress:
          allOf:
          - "$ref": "#/components/schemas/MLSAddress"
          description: The MLS style address for the transaction. The $expand OData
            parameter will have no effect on this property; it will always be returned
            with the transaction data.
        Tiers:
          type: array
          items:
            "$ref": "#/components/schemas/Tier"
          description: The list of different tiers for the transactions. At least
            1 is required.
        ClientContacts:
          type: array
          items:
            "$ref": "#/components/schemas/ClientContact"
          description: The list of client contacts for the transaction.
        BusinessContacts:
          type: array
          items:
            "$ref": "#/components/schemas/BusinessContact"
          description: The list of business contacts for the transaction.
        Conditions:
          type: array
          items:
            "$ref": "#/components/schemas/TransactionCondition"
          description: The list of conditions for the transaction.
        Task:
          type: array
          readOnly: true
          items:
            "$ref": "#/components/schemas/Task"
          description: The list of tasks for the transaction.
        CreatedTimestamp:
          type: string
          format: date-time
          readOnly: true
          description: The date and time the transaction was created.
        ModifiedTimestamp:
          type: string
          format: date-time
          readOnly: true
          description: The date and time the transaction was last modified.
        TransactionChangedTimestamp:
          type: string
          format: date-time
          readOnly: true
          description: The date and time the transaction or any of its associated
            objects were last changed. For instance, if a commission was added to
            a tier, the TransactionChangedTimestamp would hold the time that the commission
            was added. Any change to any object associated to the transaction will
            update this field. It is very useful when querying for transactions that
            have been modified since a particular date and time.
        RowVersion:
          type: integer
          format: int64
          description: The version of the record in the database.
    TransactionSearchCriteria:
      type: object
      properties:
        Numbers:
          type: array
          items:
            type: string
          description: The list of transaction numbers.
        AgentIds:
          type: array
          items:
            type: string
          description: The collection of agentIds (memberIds) that are associated
            to the commissions for the transaction.
        OfficeIds:
          type: array
          items:
            type: string
          description: The collection of officeIds. If a transaction is associated
            to an agent that is in an office with an Id in this collection, then the
