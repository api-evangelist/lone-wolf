        MLSNumbers:
          type: array
          items:
            type: string
          description: The list of MLS numbers.
        TransactionChangedTimestamp:
          allOf:
          - "$ref": "#/components/schemas/TimestampRange"
          description: The timestamp range of transaction changed timestamps.
        EntryDate:
          allOf:
          - "$ref": "#/components/schemas/DateRange"
          description: The date range of entry dates.
        CloseDate:
          allOf:
          - "$ref": "#/components/schemas/DateRange"
          description: The date range of close dates.
        OfferDate:
          allOf:
          - "$ref": "#/components/schemas/DateRange"
          description: The date range of offer dates.
        SellPrice:
          allOf:
          - "$ref": "#/components/schemas/NumericRange"
          description: The numeric range of sell prices.
        StatusCodes:
          type: array
          items:
            type: string
          description: The list of status codes.
        ClassCodes:
          type: array
          items:
            type: string
          description: The list of class codes.
        ClassificationIds:
          type: array
          items:
            type: string
          description: The list of classification codes.
        PropertyTypeIds:
          type: array
          items:
            type: string
          description: The list of property type codes.
        EndCode:
          type: string
          description: The end (or side). This doesn't have much use alone. It should
            typically be used in conjunction with other criteria dealing with commission
            records. For instance, AgentIds.
        FullDetail:
          type: boolean
          default: false
          description: True if the transaction should be fully populated when it is
            returned. The default is False.
        SearchOrders:
          type: array
          items:
            "$ref": "#/components/schemas/SearchOrder"
          description: 'The list of search order columns. This is used to order the
            search results. The SearchOrder.Property property should be one of the
            following. 1: Number, 2: MLS Number, 3: Entry Date, 4: Close Date, 5:
            Offer Date, 6: Sell Price'
    ClientError:
      type: object
      description: The ClientError object is used to give detailed information whenever
        an API request fails. If you perform a request that returns with an error
        and the response does not contain a ClientError object it is a good indication
        that you are using the wrong URL. See the Error Codes section of the introduction
        for the full list of Lone Wolf Error Codes.
      properties:
        Code:
          type: integer
          readOnly: true
          description: The Lone Wolf Error Code. See the Error Codes section of the
            introduction.
        Message:
          type: string
          readOnly: true
          description: The message that corresponds to the Code value.
        Details:
          type: string
          readOnly: true
          description: The exact problem that occurred to give this error response.
    DateRange:
      type: object
      description: The DateRange object is used to compare Date fields, not Timestamp
        fields. To compare Timestamp fields, use TimestampRange.
      properties:
        From:
          type: string
          format: date
          nullable: true
          description: The minimum date for the given range. If NULL then there is
            no lower bound for the date range. (Nullable)
        To:
          type: string
          format: date
          nullable: true
          description: The maximum date for the given range. If NULL then there is
            no upper bound for the date range. (Nullable)
    NumericRange:
      type: object
      properties:
        From:
          type: number
          nullable: true
          description: The minimum value for the given range. If NULL then there is
            no lower bound for the numeric range. (Nullable)
        To:
          type: number
          nullable: true
          description: The maximum value for the given range. If NULL then there is
            no upper bound for the numeric range. (Nullable)
    TimestampRange:
      type: object
      description: The TimestampRange object is used to compare Timestamp fields,
        not Date fields. To compare Date fields, use DateRange.
      properties:
        From:
          type: string
          format: date-time
          nullable: true
          description: The minimum value for the given range. If NULL then there is
            no lower bound for the timestamp range. (Nullable)
        To:
          type: string
          format: date-time
          nullable: true
          description: The maximum value for the given range. If NULL then there is
            no upper bound for the timestamp range. (Nullable)
    SearchOrder:
      type: object
      properties:
        Property:
          type: integer
          description: The property within the Object contained in the SearchResult
            ResultSet property to order the results on. This value will differ depending
            on which resource is being searched. Please see the individual search
            function documentation to set this value.
        Ascending:
          type: boolean
          description: True if the results should be returned in ascending order.
    SearchRequest:
      type: object
      required:
      - Criteria
      properties:
        PageSize:
          type: integer
          description: 'The number of objects to return per page in the response.
            The maximum value for PageSize is currently 1000. If you pass 0 in for
            this parameter, the maximum PageSize value will be used. NOTE: The PageSize
            returned in the SearchResponse object is not guaranteed to be equal to
            this value even if it is less than or equal to the max page size. Please
            use the PageSize value in the SearchResponse object when processing the
            response. Paging is currently not implemented; therefore, the PageSize
            value has no bearing on the response.'
        Limit:
          type: integer
          description: The maximum number of objects to return in the results. This
            value can go across pages. For instance, if you set PageSize to 10 and
            Limit to 25 and the search finds 50 records, the top 25 will be returned
            on 3 different pages.
        Criteria:
          allOf:
          - "$ref": "#/components/schemas/TransactionSearchCriteria"
          description: The object holding the criteria for the search. This object
            will differ depending on the search resource that is being called. For
            instance, a Transactions search request would set this property to a TransactionSearchCriteria
            object.
    SearchResult:
      type: object
      description: |-
        Paging is currently not implemented. Therefore PageSize will always be the number of objects in the ResultSet and TotalPages will always be 1. Write your client application as if paging were implemented. Once it is implemented your application should work as if paging were implemented all along.

        If the results all fit onto 1 page then the Id property will be NULL, PageNumber will be 1 and TotalPages will be 1. PageSize will still contain the value of the page size that would have been used if more pages were needed.
      properties:
        Id:
          type: string
          readOnly: true
          description: The Id of the search. This will be used when getting the next
            page of results for a previous search.
        PageSize:
          type: integer
          readOnly: true
          description: The page size for the response. This can also be thought of
            as the number of objects that will be returned in the ResultSet collection
            if it requires a full page.
        PageNumber:
          type: integer
          readOnly: true
          description: The page number for the response.
        TotalPages:
          type: integer
          readOnly: true
          description: The total number of pages in the search results.
        TotalResults:
          type: integer
          readOnly: true
          description: The total number of results across all pages.
        ResultSet:
          type: array
          readOnly: true
          items:
