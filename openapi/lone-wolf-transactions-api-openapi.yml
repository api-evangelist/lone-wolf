          readOnly: true
          description: The Id of the search. This will be used when getting the next page of results for a previous search.
        PageSize:
          type: integer
          readOnly: true
          description: The page size for the response. This can also be thought of as the number of objects that will be returned in the ResultSet collection if it requires a full page.
        PageNumber:
          type: integer
          readOnly: true
          description: The page number for the response.
        TotalPages:
          type: integer
          readOnly: true
          description: The total number of pages in the search results.
        TotalResults:
          type: integer
          readOnly: true
          description: The total number of results across all pages.
        ResultSet:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/Transaction_2'
          description: The list of objects for the search result. The type of objects returned depend on which search function was called. For instance, the Transaction Search function will return Transaction objects.
