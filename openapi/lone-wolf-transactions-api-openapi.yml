  /wolfconnect/transactions/v1:
    get:
      tags:
      - Transactions
      summary: Retrieve a Collection of Transactions
      operationId: getTransactions
      description: 'Retrieves a collection of transactions within the current client code. OData can be used to filter, order and page through the list.


        **OData Support:** $expand, $filter, $orderby, $skip, $top


        ### Common OData Queries


        Find all transactions for a given office:


        ```

        $filter=Tiers/any(x:x/AgentCommissions/any(y:y/OfficeId eq ''[Lone Wolf Office Id]''))

        ```


        Find all transactions for a given agent:


        ```

        $filter=Tiers/any(x:x/AgentCommissions/any(y:y/AgentId eq ''[Lone Wolf Member Id]''))

        ```


        Find all transactions modified after January 1st, 2015 at 4:00 PM EST:


        ```

        $filter=TransactionChangedTimestamp lt datetimeoffset''2015-01-01T21:00:00.0000000%2B00:00''

        ```


        Note the time was changed to UTC time. Also, the plus sign separating the time zone has been changed to the URL encoded version of %2B. This is a requirement when specifying datetimeoffset OData values.


        Find all contingent transactions (any conditions that have an approved date of null):


        ```

        $filter=Conditions/any(x:x/ApprovedDate eq null)

        ```


        Find all firm transactions (no conditions or all the conditions have a valid approved date):


        ```

        $filter=Conditions/any() eq false or Conditions/all(x:x/ApprovedDate ne null) eq true

        ```'
      parameters:
      - $ref: '#/components/parameters/ODataExpand'
      - $ref: '#/components/parameters/ODataFilter'
      - $ref: '#/components/parameters/ODataOrderBy'
      - $ref: '#/components/parameters/ODataSkip'
      - $ref: '#/components/parameters/ODataTop'
      responses:
        '200':
          description: A collection of Transaction objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction_2'
      security:
      - LoneWolfToken: []
    post:
      tags:
      - Transactions
      summary: Create a Transaction
      operationId: createTransaction
      description: 'A new Transaction must have one Tier associated to it and that Tier must have at least one AgentCommission associated to it; you will receive a validation error if you send a Transaction object without that data.


        Transaction.Number should be set to NULL unless the primary office for the transaction allows manual entry of a transaction number.


        The response will contain the newly created transaction object populated with all of the data to which you have read access. You can use the OData $expand parameter to limit the data that is returned.


        Please see the Creating and Updating Data section of the introduction for more information on how to set property values.


        **OData Support:** $expand'
      parameters:
      - $ref: '#/components/parameters/ODataExpand'
      requestBody:
        required: true
        description: A Transaction object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction_2'
      responses:
        '201':
          description: The newly created Transaction object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction_2'
        '400':
          description: 'Error Code 1006: Validation failed. See the Details property of the response for information on why the validation failed. Error Code 1008: Invalid operation. This typically happens when you are trying to create an object without the required permission (eg. you don''t have create permission for Conditions but you pass through a list of Conditions in the Transaction.Conditions property). See the Details property of the response for more information.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: A child object was not found (eg. you attempt to set the classification of a transaction with a ClassificationId that does not exist).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      security:
      - LoneWolfToken: []
    servers:
    - url: https://api.globalwolfweb.com
      description: Production
    - url: https://api-sb.globalwolfweb.com
      description: Test
  /wolfconnect/transactions/v1/{transactionId}:
    parameters:
    - name: transactionId
      in: path
      required: true
      description: The Lone Wolf Id of the transaction. This will be the value in the Transaction.Id property when the transaction was created.
      schema:
        type: string
    get:
      tags:
      - Transactions
      summary: Retrieve a Transaction
      operationId: getTransaction
      description: 'Retrieves a transaction. The data in the response will contain all of the data to which you have read access. Properties with values of NULL typically mean that you do not have read access to that property. Please see the Permissions section of the introduction for more information.


        **OData Support:** $expand'
      parameters:
      - $ref: '#/components/parameters/ODataExpand'
      responses:
        '200':
          description: A Transaction object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction_2'
        '400':
          description: 'Error Code 1001: The transaction Id is invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: The transaction could not be found. The primary office for the transaction must be an office with the Client Code used in the API authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      security:
      - LoneWolfToken: []
    put:
      tags:
      - Transactions
      summary: Update a Transaction
      operationId: updateTransaction
      description: 'It is best practice to only send data that you want updated as it will return a much faster response. For instance, if you only need to update the Transaction.CloseDate value, then you should set all other Transaction properties to null so that only a close date update is attempted.


        Unless the primary office allows manual entry for a transaction number and you actually want to change the transaction number, it is best to always set the Transaction.Number property to NULL before sending the request. This will guarantee that the transaction number is not updated.


        The status of a transaction cannot be updated using this resource. The status is a read only property. You must use the finalize resource to change the status.


        Please see the Creating and Updating Data section of the introduction for more information on how to set property values.


        The response will contain the updated transaction object populated with all of the data to which you have read access regardless of the properties sent in the request. For instance, if you sent a Transaction object with the Conditions property set to null but the transaction contained 2 conditions, the Transaction.Conditions property of the response will contain those 2 conditions. You can use the OData $expand parameter to limit the data that is returned.


        The value for the Transaction.Id property in the Transaction object sent in the request is ignored.


        **OData Support:** $expand'
      parameters:
      - $ref: '#/components/parameters/ODataExpand'
      requestBody:
        required: true
        description: A Transaction object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction_2'
      responses:
        '200':
          description: A Transaction object holding all the updated data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction_2'
        '400':
          description: 'Error Code 1006: Validation failed. See the Details property of the response for information on why the validation failed. Error Code 1008: Invalid operation. This occurs when attempting to update or create an object without the required permission. For instance, if you don''t have create permission for Conditions but you pass through a list of Conditions in the Transaction.Conditions property or if you attempt to update the Transaction.CloseDate but do not have edit permissions for that field. See the Details property of the response for more information.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: Either the transaction or a child object was not found. For instance, if you attempt to set the classification of a transaction with a ClassificationId that does not exist. The primary office for the transaction must be an office with the Client Code used in the API authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      security:
      - LoneWolfToken: []
    servers:
    - url: https://api.globalwolfweb.com
      description: Production
    - url: https://api-sb.globalwolfweb.com
      description: Test
  /wolfconnect/transactions/v1/{transactionId}/finalize:
    parameters:
    - name: transactionId
      in: path
      required: true
      description: The Lone Wolf Id of the transaction to update.
      schema:
        type: string
    put:
      tags:
      - Transactions
      summary: Finalize a Transaction
      operationId: finalizeTransaction
      description: 'The status of a transaction cannot be updated through the normal update process as you must call this resource to change the status. This resource will finalize all of the associated transaction tiers with the specified status code as well.


        The list of valid status codes is defined in the Transaction.StatusCode property in the schema definitions.'
      requestBody:
        required: true
        description: A string holding the status code for the finalized transaction.
        content:
          application/json:
            schema:
              type: string
              description: The status code for the finalized transaction.
      responses:
        '200':
          description: The transaction was finalized. No response content.
        '400':
          description: 'Error Code 1006: Validation failed. See the Details property of the response for information on why the validation failed. Error Code 1008: Invalid operation. A common reason for this error is if the transaction has been synched with brokerWOLF.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: The transaction could not be found. The primary office for the transaction must be an office with the Client Code used in the API authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      security:
