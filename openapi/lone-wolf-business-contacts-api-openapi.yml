openapi: 3.2.0
info:
  title: Back Office Business Contacts API
  version: '1.0'
  description: 'Business contacts represent a business or third party that is part of a transaction such as a home inspector or a lawyer.

    They do not represent the buyer or seller. For buyer and seller contacts, use client contacts.'
servers:
- url: https://api.lwolf.com/backoffice
tags:
- name: Business Contacts
  description: 'Business contacts represent a business or third party that is part of a transaction such as a home inspector or a lawyer.

    They do not represent the buyer or seller. For buyer and seller contacts, use client contacts.'
paths:
  /v1/transactions/{transactionId}/business-contacts:
    get:
      tags:
      - Business Contacts
      summary: Get Business Contacts
      description: Returns all the business contacts for the specified transaction.
      operationId: get-v1-transactions-transactionid-business-contacts
      parameters:
      - name: transactionId
        in: path
        description: The id of the transaction.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Request succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessContact'
              example:
              - id: string
                createdTimestamp: string
                modifiedTimestamp: string
                contactTypeId: string
                endCode: B
                prefix: string
                firstName: string
                lastName: string
                companyName: string
                addressLine1: string
                addressLine2: string
                addressCity: string
                addressPostalCode: string
                addressProvinceCode: string
                addressCountryCode: string
                phoneNumberMain: string
                phoneNumberBusiness: string
                phoneNumberMobile: string
                faxNumberMain: string
                emailAddressMain: string
                emailAddressWork: string
                contactType:
                  name: string
                  code: string
        '400':
          description: Invalid request. See response body for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                id: string
                code: 0
                message: string
                details:
                - string
