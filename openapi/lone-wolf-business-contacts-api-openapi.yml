              phoneNumberMobile: string
              faxNumberMain: string
              emailAddressMain: string
              emailAddressWork: string
              contactType:
                name: string
                code: string
      responses:
        '200':
          description: OK
        '201':
          description: Request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessContact'
              example:
                id: string
