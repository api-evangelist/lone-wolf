        '403':
          description: Permission denied. See response body for details.
        '409':
          description: Client contact already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unknown error. See response body for details.
      requestBody:
