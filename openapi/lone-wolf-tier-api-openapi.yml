openapi: 3.2.0
info:
  title: Deals Tier API
  version: 1.0.0
  description: '## Index


    For partner integration use (25.01.00)


    ### Getting Started


    #### Getting a JWT Access Token


    `POST https://authentication.api.lwolf.com/v1/login`


    All APIs require an *Authorization* HTTP Header that contains a *Bearer {token}* as its value.'
servers:
- url: https://deals.api.lwolf.com
  description: Base URL declared by the provider in apis.yml (roadmap#122).
security:
- BearerToken: []
tags:
- name: Tier
paths:
  /tiers/{tierId}:
    get:
      summary: Get a tier
      description: Using the tier guid in the request path, the method requests a tier.
      tags:
      - Tier
      security:
      - BearerToken: []
      parameters:
      - name: tierId
        in: in path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Retrieved tier successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tier'
        '400':
          description: Invalid request. See response body for details.
        '401':
          description: Unauthorized request. See response body for details.
        '403':
          description: Permission denied. See response body for details.
        '404':
          description: Tier not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unknown error. See response body for details.
      operationId: getTiersByTierId
      x-operation-id-source: derived
    patch:
      summary: Update a tier
      description: Updates a tier using its tier guid.
      tags:
      - Tier
      security:
      - BearerToken: []
      parameters:
      - name: tierId
        in: in path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successfully updated a tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tier'
        '400':
          description: Invalid request. See response body for details.
        '401':
          description: Unauthorized request. See response body for details.
        '403':
          description: Permission denied. See response body for details.
        '404':
          description: Tier not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '412':
          description: Optimistic concurrency check failed. The If-Match header is missing or it does not contain the version currently in the database.
        '500':
          description: Unknown error. See response body for details.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tier'
            example:
              id: string (UUID)
              name: string
              closePrice: number (float)
              closeDate: string (date)
              statusCode: string
              sellingCommissionAmount: number (float)
              sellingCommissionPercentage: number (float)
              sellingCommissionCalculationMethod: string
              buyingCommissionAmount: number (float)
              buyingCommissionPercentage: number (float)
              buyingCommissionCalculationMethod: string
              classificationId: string
              commissions: []
              externalCommissions: []
      operationId: patchTiersByTierId
      x-operation-id-source: derived
    delete:
      summary: Delete a tier
      description: Deletes a tier using its tier guid.
      tags:
      - Tier
      security:
      - BearerToken: []
      parameters:
      - name: tierId
        in: in path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successfully deleted a tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tier'
        '400':
          description: Invalid request. See response body for details.
        '401':
          description: Unauthorized request. See response body for details.
        '403':
          description: Permission denied. See response body for details.
        '404':
          description: Tier not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unknown error. See response body for details.
      operationId: deleteTiersByTierId
      x-operation-id-source: derived
  /deals/{dealId}/tiers:
    get:
      summary: Get all tiers
      description: Using the deal guid in the request path, the method requests the associated tiers.
      tags:
      - Tier
      security:
      - BearerToken: []
      parameters:
      - name: dealId
        in: in path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Retrieved tiers successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tier'
        '400':
          description: Invalid request. See response body for details.
        '401':
          description: Unauthorized request. See response body for details.
        '403':
          description: Permission denied. See response body for details.
        '404':
          description: Deal not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unknown error. See response body for details.
      operationId: getDealsByDealIdTiers
      x-operation-id-source: derived
    post:
      summary: Create a tier
      description: Creates a tier onto a deal using a deal guid.
      tags:
      - Tier
      security:
      - BearerToken: []
      parameters:
      - name: dealId
        in: in path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Successfully created a tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tier'
        '400':
          description: Invalid request. See response body for details.
        '401':
          description: Unauthorized request. See response body for details.
        '403':
          description: Permission denied. See response body for details.
        '404':
          description: Deal not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Tier already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unknown error. See response body for details.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tier'
            example:
              id: string (UUID)
              name: string
              closePrice: number (float)
              closeDate: string (date)
              statusCode: string
              sellingCommissionAmount: number (float)
              sellingCommissionPercentage: number (float)
              sellingCommissionCalculationMethod: string
              buyingCommissionAmount: number (float)
              buyingCommissionPercentage: number (float)
              buyingCommissionCalculationMethod: string
              classificationId: string
              commissions: []
              externalCommissions: []
      operationId: postDealsByDealIdTiers
      x-operation-id-source: derived
  /tiers/calculate-tier:
    post:
      summary: Calculate a tier
      description: Calculate a tier's commissions.
      tags:
      - Tier
      security:
      - BearerToken: []
      parameters:
      - name: tierId
        in: in path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successfully calculate a tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tier'
        '400':
          description: Invalid request. See response body for details.
        '401':
          description: Unauthorized request. See response body for details.
        '403':
          description: Permission denied. See response body for details.
        '404':
          description: Tier not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '412':
          description: Optimistic concurrency check failed. The If-Match header is missing or it does not contain the version currently in the database.
        '500':
          description: Unknown error. See response body for details.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tier'
            example:
              id: string (UUID)
              name: string
              closePrice: number (float)
              closeDate: string (date)
              statusCode: string
              sellingCommissionAmount: number (float)
              sellingCommissionPercentage: number (float)
              sellingCommissionCalculationMethod: string
              buyingCommissionAmount: number (float)
              buyingCommissionPercentage: number (float)
              buyingCommissionCalculationMethod: string
              classificationId: string
              commissions: []
              externalCommissions: []
      operationId: postTiersCalculateTier
      x-operation-id-source: derived
components:
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            type: string
    Tier:
      type: object
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JSON Web Token obtained from the Authentication API (`POST /v1/login`). Pass the token as `Authorization: Bearer <token>` in every request. Tokens expire after the number of seconds specified in the `expiresIn` field of the login response.'
