openapi: 3.2.0
info:
  title: Back Office External Agents API
  version: '1.0'
  description: Represents agents that are on the transaction but are not part of the brokerage.
servers:
- url: https://api.lwolf.com/backoffice
tags:
- name: External Agents
  description: Represents agents that are on the transaction but are not part of the brokerage.
