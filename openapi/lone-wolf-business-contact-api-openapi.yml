openapi: 3.2.0
info:
  title: Deals Business Contact API
  version: 1.0.0
  description: '## Index


    For partner integration use (25.01.00)


    ### Getting Started


    #### Getting a JWT Access Token


    `POST https://authentication.api.lwolf.com/v1/login`


    All APIs require an *Authorization* HTTP Header that contains a *Bearer {token}* as its value.'
servers:
- url: https://deals.api.lwolf.com
  description: Base URL declared by the provider in apis.yml (roadmap#122).
security:
- BearerToken: []
tags:
- name: Business Contact
paths:
  /business-contacts/{businessContactId}:
    get:
      summary: Get a business contact
      description: Using the business contact guid in the request path, the method requests a business contact.
      tags:
      - Business Contact
      security:
      - BearerToken: []
      parameters:
      - name: businessContactId
        in: in path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Retrieved business contact successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessContact'
        '400':
          description: Invalid request. See response body for details.
        '401':
          description: Unauthorized request. See response body for details.
        '403':
          description: Permission denied. See response body for details.
        '404':
          description: Business contact not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unknown error. See response body for details.
      operationId: getBusinessContactsByBusinessContactId
      x-operation-id-source: derived
    patch:
      summary: Update a business contact
      description: Using the business contact guid in the request path, the method updates the list of changes specified in the request body.
      tags:
      - Business Contact
      security:
      - BearerToken: []
      parameters:
      - name: businessContactId
        in: in path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successfully updated the business contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessContact'
        '400':
          description: Invalid request. See response body for details.
        '401':
          description: Unauthorized request. See response body for details.
        '403':
          description: Permission denied. See response body for details.
        '404':
          description: Business contact not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '412':
          description: Optimistic concurrency check failed. The If-Match header is missing or it does not contain the version currently in the database.
        '500':
          description: Unknown error. See response body for details.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessContact'
            example:
              id: string (UUID)
              contactType: string
              companyName: string
              prefix: string
              firstName: string
              middleName: string
              lastName: string
              suffix: string
              endCode: string
              addresses:
              - typeCode: string
                line1: string
                line2: string
                city: string
                provinceCode: string
                postalCode: string
                countryCode: string
              phoneNumbers:
              - typeCode: string
                ext: string
                number: string
              emailAddresses:
              - typeCode: string
                address: string
      operationId: patchBusinessContactsByBusinessContactId
      x-operation-id-source: derived
    delete:
      summary: Delete a business contact
      description: Deletes the business contact specified using the business contact guid path variable.
      tags:
      - Business Contact
      security:
      - BearerToken: []
      parameters:
      - name: businessContactId
        in: in path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successfully deleted the contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessContact'
        '400':
          description: Invalid request. See response body for details.
        '401':
          description: Unauthorized request. See response body for details.
        '403':
          description: Permission denied. See response body for details.
        '404':
          description: Business contact not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unknown error. See response body for details.
      operationId: deleteBusinessContactsByBusinessContactId
      x-operation-id-source: derived
  /deals/{dealId}/business-contacts:
