                postalCode: string
                countryCode: string
              phoneNumbers:
              - typeCode: string
                ext: string
                number: string
              emailAddresses:
              - typeCode: string
                address: string
      operationId: postDealsByDealIdBusinessContacts
      x-operation-id-source: derived
