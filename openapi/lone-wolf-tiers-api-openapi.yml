openapi: 3.2.0
info:
  title: Back Office Tiers API
  version: '1.0'
  description: Represents a tier or sub-transaction for a given transaction. All transactions must have at least one tier.
servers:
- url: https://api.lwolf.com/backoffice
tags:
- name: Tiers
  description: Represents a tier or sub-transaction for a given transaction. All transactions must have at least one tier.
