      - name: transactionId
        in: path
        description: The id of the transaction.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Request succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tier'
              example:
              - id: string
                createdTimestamp: string
                modifiedTimestamp: string
                name: string
                closePrice: 0
                closeDate: string
                statusCode: C
                classificationId: string
                sellingCommissionAmount: 0
                sellingCommissionPercentage: 0
                sellingCommissionCalculationMethodCode: A
                buyingCommissionAmount: 0
                buyingCommissionPercentage: 0
                buyingCommissionCalculationMethodCode: A
                classification:
                  name: string
                  code: string
                  endCount: 0
                  endTypeCode: B
                commissions:
                - id: string
                  createdTimestamp: string
                  modifiedTimestamp: string
                  agentId: string
                  officeId: string
                  amount: 0
                  percentage: 0
                  endCode: B
                  endCount: 0
                  calculationMethodCode: A
                  taxAmount: 0
                  totalFeeAmount: 0
                  totalFeeTaxAmount: 0
