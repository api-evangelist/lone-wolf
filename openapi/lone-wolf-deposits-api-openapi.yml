components:
  schemas:
    Deposit:
      required:
      - date
      - amount
      type: object
      properties:
        id:
          type: string
          description: The unique id.
          format: uuid
        createdTimestamp:
          type:
          - string
          - 'null'
          description: The date and time of creation in UTC time.
          format: date-time
        modifiedTimestamp:
          type:
          - string
          - 'null'
          description: The date and time last modification in UTC time.
          format: date-time
        date:
          type: string
          description: The date the deposit was received.
          format: date
        amount:
          type: number
          description: The amount of the deposit.
          format: currency
        received:
          type: boolean
          description: If the deposit has been received or not.
        interest:
          type: boolean
          description: If the deposit accumulates interest.
        held:
          type: boolean
          description: If the deposit is held or not.
        heldBy:
          type:
          - string
          - 'null'
          description: Who the deposit is held by.
        direct:
          type: boolean
          description: If the deposit is direct or not.
        reference:
          type:
          - string
          - 'null'
          description: The reference number for the deposit.
      additionalProperties: false
      description: Represents a deposit associated to a transaction.
    ApiError:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the error.
          readOnly: true
        code:
          type: integer
          description: A code used to help identify the type of error. This is typically set to the same value as the http status code.
          format: int32
          readOnly: true
        message:
          type: string
          description: A summary or short message describing the error.
          readOnly: true
        details:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of more detailed errors messages.
          readOnly: true
      additionalProperties: false
    DepositPatchRequest:
      type: object
      properties:
        date:
          type: string
          description: The date the deposit was received.
          format: date
          writeOnly: true
        amount:
          type: number
          description: The amount of the deposit.
          format: currency
          writeOnly: true
        received:
          type: boolean
          description: If the deposit has been received or not.
          writeOnly: true
        interest:
          type: boolean
          description: If the deposit accumulates interest.
          writeOnly: true
        held:
          type: boolean
          description: If the deposit is held or not.
          writeOnly: true
        heldBy:
          type:
          - string
          - 'null'
          description: Who the deposit is held by.
          writeOnly: true
        direct:
          type: boolean
          description: If the deposit is direct or not.
          writeOnly: true
        reference:
          type:
          - string
          - 'null'
          description: The reference number for the deposit.
          writeOnly: true
      additionalProperties: false
      description: Used to patch properties of a deposit.
