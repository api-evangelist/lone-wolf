openapi: 3.2.0
info:
  title: Back Office Deposits API
  version: '1.0'
  description: Represents the deposits that have are required for the transaction.
servers:
- url: https://api.lwolf.com/backoffice
tags:
- name: Deposits
  description: Represents the deposits that have are required for the transaction.
paths:
  /v1/transactions/{transactionId}/deposits:
    post:
      tags:
      - Deposits
      summary: Create Deposit
      operationId: post-v1-transactions-transactionid-deposits
      parameters:
      - name: transactionId
        in: path
        description: The id of the transaction.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: The deposit to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Deposit'
            example:
              id: string
              createdTimestamp: string
              modifiedTimestamp: string
              date: string
              amount: 0
              received: true
              interest: true
              held: true
              heldBy: string
              direct: true
              reference: string
      responses:
        '200':
          description: OK
        '201':
          description: Request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deposit'
              example:
                id: string
                createdTimestamp: string
                modifiedTimestamp: string
                date: string
                amount: 0
                received: true
                interest: true
                held: true
                heldBy: string
                direct: true
                reference: string
        '400':
          description: Invalid request. See response body for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                id: string
                code: 0
                message: string
                details:
                - string
        '401':
          description: Unauthorized. See response body for details.
