    note: OAuth 2.0 authorization-code and client-credentials flows; no operationIds declared.
  - capability: zipForm forms and transactions
    file: openapi/lone-wolf-zipform-api-openapi.yml
    operations: 28
    note: Shared Key + Context Id / External Id header auth; no operationIds declared.
  - capability: WolfConnect member and transaction data
