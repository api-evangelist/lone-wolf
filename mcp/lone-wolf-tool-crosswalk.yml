observations:
  - >-
    An MCP client pointed at Lone Wolf can read the entire contract (all seven specs, every
    operation, schema and authentication topic) and track changes over time, but cannot take
    any action against Lone Wolf systems.
  - >-
    The gap is the interesting artifact: Lone Wolf's REST surface is large, well-tagged and
    fully documented, so a product MCP server derived from these specs is a short step —
    the operationIds already exist for Transact, Back Office, Authentisign and WolfConnect
    (190 of 348 operations); Deals, TransactionDesk and zipForm would need operationIds added
    first.
