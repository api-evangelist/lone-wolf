notes:
  - >-
    Because no library is first-party, no SDKs pointer is wired into apis.yml — recording a
    community package as a vendor SDK would misstate the provider's developer experience.
  - >-
    The WolfConnect API's HMAC signature scheme (Authorization: LoneWolfToken
    [token]:[client code]:[signature]:[date] plus a Content-MD5 header) is the single strongest
    argument for a first-party SDK: it is the kind of auth developers get wrong by hand, and it
    is exactly what the one community library exists to wrap.
