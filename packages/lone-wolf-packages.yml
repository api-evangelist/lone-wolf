summary: >-
  Lone Wolf Technologies publishes NO first-party client libraries. Nothing was found on npm,
  PyPI, NuGet, Maven Central, RubyGems, Packagist or crates.io under lwolf, lone-wolf,
  zipform, authentisign or transactiondesk that is maintained by Lone Wolf. The getting-started
  page directs integrators to an access-request form and offers no SDK downloads, and the
  documentation hub links no code libraries. Integration is raw HTTP against the seven
  published OpenAPI definitions. Two community packages exist, both authored by the same
  independent developer and both predating the current Foundation platform.
