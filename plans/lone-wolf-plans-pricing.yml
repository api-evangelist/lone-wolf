summary: >-
  Lone Wolf Technologies publishes no pricing for its APIs and no pricing page for its
  products. The full 452-URL sitemap at www.lwolf.com/sitemap.xml contains no /pricing,
  /plans or /plans-pricing page — the only URLs matching "pricing" are two blog/resource
  articles about how agents should price listings. Direct probes of /pricing, /plans,
  /plans-pricing and /products all return 404. Neither the API Portal nor the API
  getting-started page names a fee, a tier, an included quota or an overage rate for API
  access; the getting-started page's only commercial statement is "Complete the access
  request form and a member of our integrations team will be in touch to get you access to
  the APIs you need." Commercial terms for both the software and the APIs are negotiated
  brokerage by brokerage. The zipForm Partner API is separately described in the
  documentation as licensed to third-party application partners, which is a licensing gate
  rather than a published plan. This is an honest zero, not a gap in the search: there is
  nothing to record because Lone Wolf publishes nothing.
