aid: lone-wolf
name: Lone Wolf Technologies
kind: company
url: https://raw.githubusercontent.com/api-evangelist/lone-wolf/refs/heads/main/apis.yml
description: >-
  Lone Wolf Technologies is the dominant back-office, transaction-management and
  forms vendor in North American residential real estate, headquartered in Dallas,
  Texas and backed by Stone Point Capital. Its software runs the paperwork and money
  side of the deal rather than the listing feed: brokerage accounting and commission
  processing (Back Office, the brokerWOLF lineage), transaction management in two
  editions (zipForm Edition and TransactionDesk Edition), Authentisign and Inkless
  e-signature, Cloud CMA comparative market analysis, Boost digital advertising
  (HomeSpotter), Spacio open-house lead capture, and Propertybase/Relationships CRM.
  Its forms suites are distributed to agents as association member benefits through
  state REALTOR associations and MLSs, which places it between the MLS layer and the
  brokerage. On API posture it is one of the strongest surfaces in this sector and an
  instructive counter-example to the MLS data providers: on 2026-02-02 it launched a
  public API Portal for the Lone Wolf Foundation platform, and its documentation hub
  at apidocs.lwolf.com publishes seven complete, anonymously downloadable OpenAPI 3.0
  definitions (Transact, Deals, Back Office, Authentisign, TransactionDesk, zipForm and
  WolfConnect) plus an MCP server endpoint. Documentation is genuinely open; credentials
  are not. Keys are issued only after an access-request form is reviewed by the
  integrations team, and the zipForm API is explicitly licensed to third-party
  application partners. Lone Wolf is not a RESO-certified data distributor and publishes
  no RESO Web API, Data Dictionary endpoint, OData $metadata document or Universal
  Property Identifier — RESO certification governs MLS listing feeds, which is not the
  layer Lone Wolf occupies; it consumes MLS data under MLS agreements (Cloud CMA
  documents RETS live queries) rather than redistributing it.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
