apis:
  - aid: lone-wolf:lone-wolf-transact-api
    name: Lone Wolf Transact API
    description: >-
      Programmatic access to Lone Wolf's transaction management platform across the full
      transaction lifecycle — creating and updating transactions, managing offers,
      contacts, folders and documents, sharing transactions across teams via share groups,
      attaching forms from form libraries, and sending documents out for e-signature.
      Resources are scoped under /users/{userId}. Collection endpoints on the Transact
      Workflow service support OData query options ($filter, $expand); this is OData query
      syntax only and is not a RESO Web API surface. Secured with a bearer token plus a
      subscription key. 37 paths / 53 operations in the published OpenAPI 3.0.3 definition.
    humanURL: https://apidocs.lwolf.com/doc/transact-api
    baseURL: https://gateway.lwolf.com
    tags:
      - Transactions
      - Offers
      - Documents
      - Signings
      - Contacts
      - Form Libraries
    properties:
      - type: OpenAPI
        url: openapi/lone-wolf-transact-api-openapi.yml
      - type: Documentation
        url: https://apidocs.lwolf.com/doc/transact-api
      - type: APIReference
        url: https://apidocs.lwolf.com/doc/transact-api
      - type: Changelog
        url: https://apidocs.lwolf.com/doc/transact-api/changes/2ffeff3a
      - type: DeveloperPortal
        url: https://www.lwolf.com/api-portal
  - aid: lone-wolf:lone-wolf-deals-api
    name: Lone Wolf Deals API
    description: >-
      Partner-integration API (release 25.01.00) covering deal records across the Lone Wolf
      Foundation platform. All requests require an Authorization header carrying a Bearer
      JWT obtained by POSTing credentials to https://authentication.api.lwolf.com/v1/login.
      The largest operation surface published by Lone Wolf — 53 paths / 86 operations — but
      the OpenAPI definition declares no servers block, so no production base URL is
      asserted here.
    humanURL: https://apidocs.lwolf.com/doc/deals-api
    tags:
      - Deals
      - Transactions
      - Partner Integration
    properties:
      - type: OpenAPI
        url: openapi/lone-wolf-deals-api-openapi.yml
      - type: Documentation
        url: https://apidocs.lwolf.com/doc/deals-api
      - type: Changelog
        url: https://apidocs.lwolf.com/doc/deals-api/changes/dc2c920d
      - type: Authentication
        url: https://authentication.api.lwolf.com/v1/login
      - type: DeveloperPortal
        url: https://www.lwolf.com/api-portal
  - aid: lone-wolf:lone-wolf-back-office-api
    name: Lone Wolf Back Office API
    description: >-
      Brokerage back-office and accounting API covering the money side of the transaction —
      commissions, commission fees and tiers, deposits, conditions and condition types,
      classifications, employees, offices, transactions, and business and client contacts.
      This is the brokerWOLF/Back Office Online lineage, the system of record for brokerage
      accounting. 39 paths / 69 operations in the published OpenAPI 3.0.1 definition.
    humanURL: https://apidocs.lwolf.com/doc/back-office-online-api
    baseURL: https://api.lwolf.com/backoffice
    tags:
      - Back Office
      - Accounting
      - Commissions
      - Deposits
      - Offices
      - Employees
    properties:
      - type: OpenAPI
        url: openapi/lone-wolf-back-office-online-api-openapi.yml
      - type: Documentation
        url: https://apidocs.lwolf.com/doc/back-office-online-api
      - type: DeveloperPortal
        url: https://www.lwolf.com/api-portal
  - aid: lone-wolf:lone-wolf-authentisign-api
    name: Lone Wolf Authentisign API
    description: >-
      E-signature API for Authentisign, Lone Wolf's signing product. Creates and manages
      signings, signer roles, documents and signing status. Supports an optional CallbackUrl
      on a signing, and a PATCH endpoint to update it, giving a real webhook surface for
      signing events — the only genuine event/callback mechanism found across Lone Wolf's
      published definitions. 41 paths / 46 operations in the published OpenAPI 3.0.1
      definition; the definition declares no securitySchemes block.
    humanURL: https://apidocs.lwolf.com/doc/authentisign-api
    baseURL: https://api.lwolf.com/authentisign
    tags:
      - E-Signature
      - Signings
      - Documents
      - Webhooks
    properties:
      - type: OpenAPI
        url: openapi/lone-wolf-authentisign-api-openapi.yml
      - type: Documentation
        url: https://apidocs.lwolf.com/doc/authentisign-api
      - type: DeveloperPortal
        url: https://www.lwolf.com/api-portal
  - aid: lone-wolf:lone-wolf-transactiondesk-api
    name: Lone Wolf TransactionDesk Partner API
    description: >-
      Partner API for the TransactionDesk edition of Lone Wolf Transactions, covering
      transaction summaries, documents, contacts and contact types, transaction types and
      statuses, single sign-on, and resource metadata. Uses an OAuth 2.0 authorization-code
      flow — redirect to /oauth/authorize, exchange a one-time code (10-minute expiry) at
      POST /oauth/token, then send Authorization: Bearer. 25 paths / 44 operations. Note the
      only server declared in the definition is the preproduction host
      https://api.pre.transactiondesk.com; no production base URL is published.
    humanURL: https://apidocs.lwolf.com/doc/transactiondesk-api
    baseURL: https://api.pre.transactiondesk.com
    tags:
      - Transactions
      - Documents
      - Contacts
      - Single Sign On
      - OAuth
    properties:
      - type: OpenAPI
        url: openapi/lone-wolf-transactiondesk-api-openapi.yml
      - type: Documentation
        url: https://apidocs.lwolf.com/doc/transactiondesk-api
      - type: DeveloperPortal
        url: https://www.lwolf.com/api-portal
  - aid: lone-wolf:lone-wolf-zipform-api
    name: Lone Wolf zipForm Partner API
    description: >-
      The zipForm REST web service (v5.1), exposing zipForm transaction data, PDF forms and
      selected zipForm application functionality for integration into partner applications.
      Explicitly made available on a licensed basis to third-party application partners.
      Authentication combines a Shared Key with either a Context Id or an External Id,
      passed via X-Auth-ContextId / X-Auth-SharedKey headers or query string. 22 paths /
      28 operations, with production and staging base URLs both published.
    humanURL: https://apidocs.lwolf.com/doc/zipform-api
    baseURL: https://ws.zipformplus.com/api
    tags:
      - zipForm
      - Forms
      - Transactions
      - Templates
      - Title Integration
    properties:
      - type: OpenAPI
        url: openapi/lone-wolf-zipform-api-openapi.yml
      - type: Documentation
        url: https://apidocs.lwolf.com/doc/zipform-api
      - type: Changelog
        url: https://apidocs.lwolf.com/doc/zipform-api/changes/27ccca82
      - type: DeveloperPortal
        url: https://www.lwolf.com/api-portal
  - aid: lone-wolf:lone-wolf-wolfconnect-api
    name: Lone Wolf WolfConnect API
    description: >-
      A collection of RESTful web resources giving third parties access to Lone Wolf data —
      members, transactions, classifications, conditions, contact types, property types and
      sources of business. Authentication uses a signed Authorization header (LoneWolfToken
      HMAC signature scheme). Documents OData support, concurrency checking, compression and
      permissions. 15 paths / 22 operations, with both production and sandbox hosts published.
    humanURL: https://apidocs.lwolf.com/doc/wolfconnect-api
    baseURL: https://api.globalwolfweb.com
    tags:
      - Members
      - Transactions
      - Classifications
      - Property Types
    properties:
      - type: OpenAPI
        url: openapi/lone-wolf-wolfconnect-api-openapi.yml
      - type: Documentation
        url: https://apidocs.lwolf.com/doc/wolfconnect-api
      - type: Changelog
        url: https://apidocs.lwolf.com/doc/wolfconnect-api/changes/a612bf03
      - type: Sandbox
        url: https://api-sb.globalwolfweb.com
      - type: DeveloperPortal
        url: https://www.lwolf.com/api-portal
