- aid: lone-wolf:lone-wolf-authentisign-api
  name: Lone Wolf Authentisign API
  description: >-
    E-signature API for Authentisign, Lone Wolf's signing product. Creates and manages signings, signer
    roles, documents and signing status. Supports an optional CallbackUrl on a signing, and a PATCH endpoint
    to update it, giving a real webhook surface for signing events — the only genuine event/callback mechanism
    found across Lone Wolf's published definitions. 41 paths / 46 operations in the published OpenAPI
    3.0.1 definition; the definition declares no securitySchemes block.
  humanURL: https://apidocs.lwolf.com/doc/authentisign-api
  baseURL: https://api.lwolf.com/authentisign
  tags:
  - E-Signature
  - Signings
  - Documents
  - Webhook
  tags_raw:
