summary: >-
  The Transaction (called Deal in the Deals API) is the hub of every Lone Wolf data model. In
  the accounting lineages — Back Office Online and WolfConnect — a Transaction owns Tiers, and
  a Tier owns the Commissions: that is the shape of a real-estate deal's money, where a tier is
  a side of the deal and each commission is one agent's cut of it. In the workflow lineages —
  Transact, TransactionDesk, zipForm — the Transaction instead owns Documents, Folders, Forms,
  Offers and Contacts: the paperwork. Both halves hang the same Client Contacts and Business
  Contacts off the transaction, and both classify it with the same reference entities
  (Classification, PropertyType, ContactType, ConditionType, SourceOfBusiness). Back Office and
  WolfConnect model the same domain with near-identical entity names in different casing —
  strong evidence they are two generations of one system rather than two products.
core_entities:
  - entity: Transaction
    aka: [Deal, Transaction Summary]
    apis: [Back Office Online API, WolfConnect API, Deals API, Transact API, TransactionDesk Partner API, zipForm Partner API]
    role: the deal record; hub of every model
  - entity: Tier
    apis: [Back Office Online API, WolfConnect API, Deals API]
    role: a side/leg of the transaction that carries commission splits
  - entity: Commission
    apis: [Back Office Online API, Deals API]
    aka: [AgentCommission (WolfConnect)]
  - entity: ClientContact
    apis: [Back Office Online API, WolfConnect API, Deals API]
  - entity: BusinessContact
    apis: [Back Office Online API, WolfConnect API, Deals API]
  - entity: ExternalAgent
    apis: [Back Office Online API, WolfConnect API, Deals API]
  - entity: Member
    apis: [WolfConnect API]
    role: the person record — agents, staff — with MLS board memberships and public profiles
  - entity: Employee
    apis: [Back Office Online API]
  - entity: Office
    apis: [Back Office Online API, Transact API]
  - entity: Signing
    apis: [Authentisign API]
  - entity: Offer
    apis: [Transact API]
  - entity: Document
    apis: [Transact API, TransactionDesk Partner API, zipForm Partner API, Authentisign API]
  - entity: Folder
    apis: [Transact API]
  - entity: Form / FormPackage
    apis: [Transact API, zipForm Partner API]
  - entity: ShareGroup
    apis: [Transact API]
