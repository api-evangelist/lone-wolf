cross_api_joins:
  - >-
    Authentisign carries both signingId and transactionId on Participant and Cc, plus a
    dedicated TransactionDesk link DTO (TDLinkTransactionDto with a documents checklist) —
    the only explicit cross-product foreign key published anywhere in the estate.
  - >-
    Transact routes Authentisign under /authentisign/v3 on the same gateway, so a signing
    created through Transact and a signing read through the Authentisign API are the same
    record.
  - >-
    WolfConnect contacts carry CRMId / CRMCompanyContactId fields pointing at Lone Wolf's CRM
    (Propertybase / Relationships), and Members carry MLS board identifiers (MLSId,
    MLSAreaId) — the join points out to the MLS layer Lone Wolf consumes but does not
    redistribute.
identifier_conventions:
  format: GUID (uuid) for most Foundation-era resources; opaque base64-ish strings in WolfConnect (e.g. 98agdji99jasdof908==)
  prefixes: none — Lone Wolf uses no typed id prefixes
  user_scoping: >-
    Transact addresses nearly everything under /users/{userId}; TransactionDesk's
    client_credentials flow uses an On-Behalf-Of header for the same purpose.
gaps:
  - >-
    The Deals API — the largest surface at 86 operations — declares almost no schema
    relationships: its components carry 22 schemas but only the Login object exposes reference
    fields, so its entity graph is documented in prose (the Getting Started and Roster
    sections) rather than in the spec.
  - >-
    No API publishes an ERD, an object reference with id prefixes, or a $metadata document.
